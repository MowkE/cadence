<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Cadence</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0e1014; color: #f2f2f7; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .card { width: min(420px, 92vw); padding: 32px 36px; border-radius: 18px; background: rgba(255,255,255,.05);
          border: 1px solid rgba(255,255,255,.1); text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.01em; }
  p { margin: 0 0 18px; color: #b8b8c4; }
  button { min-height: 46px; padding: 0 22px; border: 0; border-radius: 12px; background: #fff; color: #0b0b10;
           font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: #ff8a8a; }
  .fine { font-size: 12px; color: #7d7d8a; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Cadence</h1>
  <p id="msg">Sign in to use your account, friends and profile picture in Cadence.</p>
  <button id="go">Continue with Google</button>
  <div class="fine" id="fine">You'll be sent straight back to Cadence.</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const state = q.get('state') || '';
  const cfg = { apiKey: q.get('apiKey') || '', authDomain: q.get('authDomain') || '', projectId: q.get('projectId') || '' };
  const msg = document.getElementById('msg');
  const go = document.getElementById('go');
  const back = params => { location.href = 'cadence://auth#' + new URLSearchParams(params).toString(); };

  if (!cfg.apiKey || !state) {
    msg.textContent = cfg.apiKey ? 'Open this page from Cadence (gear → Account → Sign in).' : 'Cadence accounts aren\'t set up on this build yet.';
    go.disabled = true;
    return;
  }
  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const emu = q.get('emulator');
  if (emu && /^https?:\/\/(127\.0\.0\.1|localhost)/.test(emu)) auth.useEmulator(emu, { disableWarnings: true });

  go.addEventListener('click', async () => {
    go.disabled = true;
    msg.textContent = 'Finishing sign-in with Google…';
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      const result = await auth.signInWithPopup(provider);
      const idToken = result.credential && result.credential.idToken;
      if (!idToken) throw new Error('Google did not return a token');
      msg.textContent = 'Signed in. Sending you back to Cadence…';
      document.getElementById('fine').textContent = 'You can close this tab once Cadence opens.';
      back({ state, id_token: idToken });
    } catch (err) {
      msg.innerHTML = '<span class="err">' + (err && err.message ? err.message : 'Sign-in failed') + '</span>';
      go.disabled = false;
      go.textContent = 'Try again';
      if (err && err.code === 'auth/popup-closed-by-user') return;
      if (err && err.code === 'auth/unauthorized-domain') msg.innerHTML += '<br><span class="fine">Add this page\'s domain under Firebase → Authentication → Settings → Authorized domains.</span>';
      if (err && err.code === 'auth/operation-not-allowed') msg.innerHTML = '<span class="err">Google sign-in isn\'t switched on for this project yet.</span><br><span class="fine">The owner needs to enable Google under Firebase → Authentication → Sign-in method.</span>';
    }
  });
})();
</script>
</body>
</html>
